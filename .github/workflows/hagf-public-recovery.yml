name: HAGF Public Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate collector and run unit tests
        run: |
          python -m py_compile scripts/hagf_public_recovery.py
          python -m unittest discover -s tests -v
          python scripts/hagf_public_recovery.py

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: hagf-public-recovery-validation
          path: research/execucoes/*.json
          if-no-files-found: warn
          retention-days: 30
