name: HAGF Public Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile, test and generate preservation ledger
        run: |
          python -m py_compile scripts/hagf_public_recovery.py scripts/hagf_preservation_ledger.py
          python -m unittest discover -s tests -v
          python scripts/hagf_preservation_ledger.py
          python scripts/hagf_public_recovery.py

      - name: Upload preservation and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: hagf-preservation-ledger
          path: |
            research/execucoes/*.json
            research/execucoes/*.csv
          if-no-files-found: error
          retention-days: 90
